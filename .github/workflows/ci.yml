name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  docker-compose:
    name: docker-compose (production container)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: blacksmith docker
        uses: useblacksmith/setup-docker-builder@ac083cc84672d01c60d5e8561d0a939b697de542 # v1.7.0
      - name: docker build / start
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose -f docker-compose.ci.yml build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 30
      - name: wait for nginx
        run: while ! nc -z localhost 443; do sleep 0.1; done
      - name: ping
        run: curl --insecure https://localhost/ping -vvv
      - name: openapi
        run: curl --insecure https://localhost/openapi -vvv
      - name: docker stop
        run: docker compose -f docker-compose.ci.yml stop
  docker:
    name: docker (development container)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: petstore
          MONGO_INITDB_ROOT_PASSWORD: 4aAUfBjDACcdZxNwJgJ6
        ports:
          - 27017:27017
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: blacksmith docker
        uses: useblacksmith/setup-docker-builder@ac083cc84672d01c60d5e8561d0a939b697de542 # v1.7.0
      - name: docker build
        env:
          DOCKER_BUILDKIT: 1
        run: docker build --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -u) --build-arg BUILDKIT_INLINE_CACHE=1 -f docker/development/node/Dockerfile . -t node
      - name: pnpm install
        run: docker container run -v ${GITHUB_WORKSPACE}:/app node /bin/bash -c 'source ~/.bashrc && pnpm install'
      - name: pnpm run cs
        run: docker container run -v ${GITHUB_WORKSPACE}:/app node /bin/bash -c 'source ~/.bashrc && pnpm run cs'
      - name: pnpm run lint
        run: docker container run -v ${GITHUB_WORKSPACE}:/app node /bin/bash -c 'source ~/.bashrc && pnpm run lint'
      - name: pnpm run test --run --coverage --no-cache
        run: docker container run -v ${GITHUB_WORKSPACE}:/app node /bin/bash -c 'source ~/.bashrc && pnpm run test --run --coverage --no-cache'
      - name: pnpm run test:integration --run --no-cache
        run: docker container run -v ${GITHUB_WORKSPACE}:/app -e 'MONGO_URI=mongodb://petstore:4aAUfBjDACcdZxNwJgJ6@172.17.0.1:27017/petstore?authMechanism=DEFAULT&authSource=admin' node /bin/bash -c 'source ~/.bashrc && pnpm run test:integration --run --no-cache'
      - name: pnpm run build
        run: docker container run -v ${GITHUB_WORKSPACE}:/app node /bin/bash -c 'source ~/.bashrc && pnpm run build'
  node22:
    name: Node 22
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checkout node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: "22"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test --run
  node24:
    name: Node 24
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: petstore
          MONGO_INITDB_ROOT_PASSWORD: 4aAUfBjDACcdZxNwJgJ6
        ports:
          - 27017:27017
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: checkout node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: "24"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm run cs
      - run: pnpm run lint
      - run: pnpm run test --run --coverage --no-cache
      - run: pnpm run test:integration --run --no-cache
        env:
          MONGO_URI: "mongodb://petstore:4aAUfBjDACcdZxNwJgJ6@172.17.0.1:27017/petstore?authMechanism=DEFAULT&authSource=admin"
      - run: pnpm run infection
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      - run: pnpm run build
      - name: coveralls.io
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: sonarcloud.io
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  node26:
    name: Node 26
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checkout node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: "26"
      - run: npm install -g --ignore-scripts pnpm@11.0.9
      - run: pnpm install --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test --run

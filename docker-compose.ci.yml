services:
  node:
    container_name: chubbyts-petstore-node-ci
    hostname: chubbyts-petstore-node-ci
    build:
      dockerfile: ./docker/production/node/Dockerfile
      context: ./
    environment:
      NODE_ENV: production
      MONGO_URI: 'mongodb://petstore:4aAUfBjDACcdZxNwJgJ6@mongo:27017/petstore?authMechanism=DEFAULT&authSource=admin'
      SERVER_HOST: '0.0.0.0'
      SERVER_PORT: '1234'
      OIDC_ISSUER: 'http://keycloak:8080/realms/petstore'
      OIDC_AUDIENCE: 'petstore'
    depends_on:
      - keycloak
      - mongo
  keycloak:
    container_name: chubbyts-petstore-keycloak-ci
    hostname: chubbyts-petstore-keycloak-ci
    image: quay.io/keycloak/keycloak:26.7
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: TCUJyCbLtLbBc4eXYYzD9ecm
      # fixed hostname, so the issuer claim is "http://keycloak:8080/realms/petstore" no matter where the token
      # gets requested from: the ci job adds "127.0.0.1 keycloak" to /etc/hosts to request tokens from the host
      KC_HOSTNAME: 'http://keycloak:8080'
    ports:
      - '8080:8080'
    volumes:
      - ./docker/development/keycloak/import:/opt/keycloak/data/import
  mongo:
    container_name: chubbyts-petstore-mongo-ci
    hostname: chubbyts-petstore-mongo-ci
    image: mongo:8.0.4 # check before upgrade https://www.mongodb.com/community/forums/t/mongodb-8-x-and-linux-kernel-6-19/337547
    environment:
      MONGO_INITDB_ROOT_USERNAME: petstore
      MONGO_INITDB_ROOT_PASSWORD: 4aAUfBjDACcdZxNwJgJ6
  swagger-ui:
    container_name: chubbyts-petstore-swagger-ui-ci
    hostname: chubbyts-petstore-swagger-ui-ci
    image: swaggerapi/swagger-ui:v5.30.1
    environment:
      BASE_URL: /swagger
      URLS: '[ { url: "/openapi" } ]'
  nginx:
    container_name: chubbyts-petstore-nginx-ci
    hostname: chubbyts-petstore-nginx-ci
    image: nginx:1
    environment:
      SERVER_PORT: '443'
      NODE_SERVER_HOST: 'node'
      NODE_SERVER_PORT: '1234'
      SWAGGER_SERVER_HOST: 'swagger-ui'
      SWAGGER_SERVER_PORT: '8080'
    ports:
      - '443:443'
    volumes:
      - ./docker/development/nginx:/etc/nginx/templates
    depends_on:
      - node
      - swagger-ui

name: chubbyts-petstore
services:
  node:
    container_name: chubbyts-petstore-node
    hostname: chubbyts-petstore-node
    build:
      dockerfile: ./docker/development/node/Dockerfile
      context: ./
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    userns_mode: keep-id
    environment:
      NODE_ENV: development
      POSTGRES_URI: 'postgres://petstore:4aAUfBjDACcdZxNwJgJ6@postgres:5432/petstore'
      SERVER_HOST: '0.0.0.0'
      SERVER_PORT: '1234'
      SSH_AUTH_SOCK: /ssh-agent
      LLAMA_BASE_URL: http://host.docker.internal:9931/v1
      OIDC_ISSUER: 'http://keycloak:8080/realms/petstore'
      OIDC_AUDIENCE: 'petstore'
    ports:
      - '1235:1235'
    volumes:
      - ${PWD}:/app
      - $SSH_AUTH_SOCK:/ssh-agent
      # bash
      - ~/.bash_docker:/home/node/.bash_docker
      - ~/.bash_history:/home/node/.bash_history
      # zsh
      - ~/.zsh_docker:/home/node/.zsh_docker
      - ~/.zsh_history:/home/node/.zsh_history
      # git
      - ~/.gitconfig:/home/node/.gitconfig
      - ~/.gitignore:/home/node/.gitignore
      # ssh
      - ~/.ssh/github.pub:/home/node/.ssh/github.pub
      # npm
      - ~/.npmrc:/home/node/.npmrc
      # claude - coding agent
      - ~/.claude.json:/home/node/.claude.json
      - ~/.claude/.credentials.json:/home/node/.claude/.credentials.json
      - ~/.claude/settings.json:/home/node/.claude/settings.json
      # codex - coding agent
      - ~/.codex/auth.json:/home/node/.codex/auth.json
      - ~/.codex/config.toml:/home/node/.codex/config.toml
      # opencode - coding agent
      - ~/.config/opencode/opencode.jsonc:/home/node/.config/opencode/opencode.jsonc
      - ~/.config/opencode/tui.json:/home/node/.config/opencode/tui.json
      - ~/.local/share/opencode/auth.json:/home/node/.local/share/opencode/auth.json
      # pi - coding agent
      - ~/.pi/agent/auth.json:/home/node/.pi/agent/auth.json
    depends_on:
      - postgres
      - keycloak
  node-fluentd:
    container_name: chubbyts-petstore-node-fluentd
    hostname: chubbyts-petstore-node-fluentd
    build:
      dockerfile: ./docker/production/node-fluentd/Dockerfile
      context: ./
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      STACK: 'local'
      OPENSEARCH_HOSTS: 'opensearch:9200'
      OPENSEARCH_USER: 'admin'
      OPENSEARCH_PASSWORD: 't9V02zfj!NMj?LugFsOi'
      OPENSEARCH_SSL_VERIFY: 'false'
    volumes:
      - ${PWD}/var/log:/app/var/log
    depends_on:
      - opensearch
  keycloak:
    container_name: chubbyts-petstore-keycloak
    hostname: chubbyts-petstore-keycloak
    image: quay.io/keycloak/keycloak:26.7
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: TCUJyCbLtLbBc4eXYYzD9ecm
      # fixed hostname, so the issuer claim is "http://keycloak:8080/realms/petstore" no matter where the token
      # gets requested from: add "127.0.0.1 keycloak" to /etc/hosts on the host to request tokens from there
      KC_HOSTNAME: 'http://keycloak:8080'
    ports:
      - '8080:8080'
    volumes:
      - ./docker/development/keycloak/import:/opt/keycloak/data/import
  nginx:
    container_name: chubbyts-petstore-nginx
    hostname: chubbyts-petstore-nginx
    image: nginx:1
    environment:
      SERVER_PORT: '443'
      NODE_SERVER_HOST: 'node'
      NODE_SERVER_PORT: '1234'
      SWAGGER_SERVER_HOST: 'swagger-ui'
      SWAGGER_SERVER_PORT: '8080'
    ports:
      - '443:443'
    volumes:
      - ./docker/development/nginx:/etc/nginx/templates
    depends_on:
      - node
      - swagger-ui
  opensearch:
    container_name: chubbyts-petstore-opensearch
    hostname: chubbyts-petstore-opensearch
    image: opensearchproject/opensearch:2
    environment:
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: 't9V02zfj!NMj?LugFsOi'
      discovery.type: 'single-node'
    ports:
      - 9200:9200
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sk https://localhost:9200 | grep -q 'Unauthorized'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  opensearch-dashboard:
    container_name: chubbyts-petstore-opensearch-dashboard
    hostname: chubbyts-petstore-opensearch-dashboard
    image: opensearchproject/opensearch-dashboards:2
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    ports:
      - 5601:5601
  postgres:
    container_name: chubbyts-petstore-postgres
    hostname: chubbyts-petstore-postgres
    image: postgres:17
    command: -c log_statement=all -c log_error_verbosity=VERBOSE
    environment:
      POSTGRES_DB: petstore
      POSTGRES_PASSWORD: 4aAUfBjDACcdZxNwJgJ6
      POSTGRES_USER: petstore
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
  swagger-ui:
    container_name: chubbyts-petstore-swagger-ui
    hostname: chubbyts-petstore-swagger-ui
    image: swaggerapi/swagger-ui
    environment:
      BASE_URL: /swagger
      URLS: '[ { url: "/openapi" } ]'

volumes:
  postgres:

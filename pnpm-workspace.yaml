allowBuilds:
  esbuild: true
  unrs-resolver: true
# can be removed once 1.1.0 is older than pnpm's default minimumReleaseAge
minimumReleaseAgeExclude:
  - '@chubbyts/chubbyts-undici-oidc@1.1.0'
packageExtensions:
  '@stryker-mutator/core':
    dependencies:
      typescript: ^6.0.3
  '@stryker-mutator/typescript-checker':
    dependencies:
      typescript: ^6.0.3
